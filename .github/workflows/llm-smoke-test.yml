name: LLM Smoke Test

on:
  workflow_dispatch:

jobs:
  test-qwen:
    name: Test Qwen Connection
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Test Qwen API
        env:
          BASE_URL: https://ws-y6j3blg710191x6y.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
          API_KEY: ${{ secrets.LLM_DASHSCOPE_API_KEY }}
          MODEL: qwen3.7-plus
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::LLM_DASHSCOPE_API_KEY is not configured"
            exit 1
          fi

          echo "Model: $MODEL"
          echo "Base URL: $BASE_URL"
          echo "API key: configured"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --max-time 60 \
            --output response.json \
            --write-out "%{http_code}" \
            "$BASE_URL/chat/completions" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$MODEL\",
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": \"Reply only: OK\"
                }
              ],
              \"max_tokens\": 8,
              \"stream\": false
            }")

          echo "HTTP status: $HTTP_CODE"

          cat response.json
          echo ""

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::LLM request failed"
            exit 1
          fi

          echo "✅ Qwen LLM connection successful"
