name: LLM Smoke Test

on:
  workflow_dispatch:

jobs:
  test-qwen:
    name: Test Qwen Connection
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validate configuration
        env:
          BASE_URL: ${{ vars.LLM_DASHSCOPE_BASE_URL }}
          API_KEY: ${{ secrets.LLM_DASHSCOPE_API_KEY }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::LLM_DASHSCOPE_BASE_URL is not configured"
            exit 1
          fi

          if [ -z "$API_KEY" ]; then
            echo "::error::LLM_DASHSCOPE_API_KEY is not configured"
            exit 1
          fi

          echo "Configuration found"
          echo "Base URL: $BASE_URL"
          echo "API key: configured"

      - name: Test Qwen API
        env:
          BASE_URL: ${{ vars.LLM_DASHSCOPE_BASE_URL }}
          API_KEY: ${{ secrets.LLM_DASHSCOPE_API_KEY }}
          MODEL: qwen3.7-plus
        run: |
          echo "=========================================="
          echo "Qwen LLM Smoke Test"
          echo "=========================================="
          echo "Model: $MODEL"
          echo "Base URL: $BASE_URL"
          echo ""

          START_TIME=$(date +%s)

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --max-time 60 \
            --output response.json \
            --write-out "%{http_code}" \
            "$BASE_URL/chat/completions" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$MODEL\",
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": \"Reply only: OK\"
                }
              ],
              \"max_tokens\": 8,
              \"stream\": false
            }")

          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))

          echo "HTTP status: $HTTP_CODE"
          echo "Elapsed: ${ELAPSED}s"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo ""
            echo "::error::LLM request failed with HTTP $HTTP_CODE"
            echo "Provider response:"
            cat response.json
            exit 1
          fi

          echo ""
          echo "Provider response:"
          cat response.json
          echo ""

          if grep -q '"choices"' response.json; then
            echo ""
            echo "✅ Qwen LLM connection successful"
          else
            echo ""
            echo "::error::HTTP 200 received but response does not contain choices"
            exit 1
          fi
