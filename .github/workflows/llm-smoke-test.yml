name: LLM Smoke Test

on:
  workflow_dispatch:

jobs:
  test-llm:
    name: Test Qwen Connection
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Test LLM API
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL }}

        run: |
          set -e

          echo "=========================================="
          echo "LLM Smoke Test"
          echo "=========================================="

          if [ -z "$API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not configured"
            exit 1
          fi

          if [ -z "$BASE_URL" ]; then
            echo "::error::OPENAI_BASE_URL is not configured"
            exit 1
          fi

          if [ -z "$LITELLM_MODEL" ]; then
            echo "::error::LITELLM_MODEL is not configured"
            exit 1
          fi

          # LiteLLM 使用 openai/qwen3.7-plus
          # 百炼 OpenAI-compatible API 实际需要 qwen3.7-plus
          MODEL="${LITELLM_MODEL#openai/}"

          # 防止 Base URL 末尾带 /
          BASE_URL="${BASE_URL%/}"

          echo "OPENAI_API_KEY: configured"
          echo "OPENAI_BASE_URL: $BASE_URL"
          echo "LITELLM_MODEL: $LITELLM_MODEL"
          echo "Provider model: $MODEL"
          echo ""

          START_TIME=$(date +%s)

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --max-time 60 \
            --output response.json \
            --write-out "%{http_code}" \
            "$BASE_URL/chat/completions" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$MODEL\",
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": \"Reply only: OK\"
                }
              ],
              \"max_tokens\": 8,
              \"stream\": false
            }")

          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))

          echo "HTTP status: $HTTP_CODE"
          echo "Elapsed: ${ELAPSED}s"
          echo ""

          if [ -f response.json ]; then
            echo "Provider response:"
            cat response.json
            echo ""
          fi

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::LLM request failed with HTTP $HTTP_CODE"
            exit 1
          fi

          if ! grep -q '"choices"' response.json; then
            echo "::error::HTTP 200 received but response does not contain choices"
            exit 1
          fi

          echo ""
          echo "✅ LLM connection successful"
